openapi: 3.2.0
info:
  title: Apilayer Endpoints API
  version: 1.0.0
  description: 'Operations tagged Endpoints across 3 of this provider''s published API definitions: apilayer-exchangerate-openapi-original.json, apilayer-exchangeratesapi-openapi-original.json, apilayer-ipapi-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.exchangerate.host
- url: https://api.exchangeratesapi.io/v1
- url: https://api.ipapi.com/api
tags:
- name: Endpoints
paths:
  /change:
    get:
      tags:
      - Endpoints
      summary: ExchangeRate.host :- /change
      description: Returns the change (both margin and percentage) of one or more currencies, relative to a Source Currency, within a specific time-frame. If no time-frame is supplied the API returns change values from yesterday's EOD data to the latest available rates.
      operationId: exchangeratehostChange
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: 'Specify the start date of your time frame. [Format: YYYY-MM-DD]'
        required: false
        schema:
          type: string
          example: '2010-03-01'
      - name: end_date
        in: query
        description: 'Specify the end date of your time frame. [Format: YYYY-MM-DD]'
        required: false
        schema:
          type: string
          example: '2010-04-01'
      - name: source
        in: query
        description: Specify a Source Currency other than the default USD. Supported on the Basic Plan and higher.
        required: false
        schema:
          type: string
          example: USD
      - name: currencies
        in: query
        description: Specify a comma-separated list of currency codes to limit your API response to specific currencies.
        required: false
        schema:
          type: string
          example: USD,GBP,EUR
      - name: format
        in: query
        description: Set to `1` for pretty-printed JSON.
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
          example: 1
      - name: callback
        in: query
        description: Wrap the response in the function name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: "Currency change (start/end rate, absolute + percentage) per currency pair.\n *\n * **Note:** *Since foreign exchange (forex) markets are only open from Sunday 5 PM ET to Friday 5 PM ET, change parameters may converge to zero during weekends.*"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResponse'
              examples:
                changeExample:
                  summary: Example change response
                  value:
                    success: true
                    terms: https://currencylayer.com/terms
                    privacy: https://currencylayer.com/privacy
                    change: true
                    start_date: '2015-01-01'
                    end_date: '2015-01-02'
                    source: USD
                    quotes:
                      USDAUD:
                        start_rate: 1.2345
                        end_rate: 1.3456
                        change: 0.1111
                        change_pct: 0.09
        '400':
          description: Bad Request - validation error (e.g. invalid_source_currency, invalid_currency_codes, no_timeframe_supplied, invalid_start_date, invalid_end_date).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangerate.host
  /timeframe:
    get:
      tags:
      - Endpoints
      summary: ExchangeRate.host :- /timeframe
      description: 'Returns historical exchange rates for a time-period of your choice (maximum range: 365 days). Specify your preferred time frame consisting of a start_date and an end_date, both of the format YYYY-MM-DD.

        *

        * **Note:** *Since the exchangeratehost API supports time frames of up to 365 days, not limiting the output currencies may produce very large files. For optimal performance and reduced server load, it is recommended to use the currencies parameter to select only the currencies you need.*'
      operationId: exchangeratehostTimeframe
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: 'Specify the start date of your time frame. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          example: '2010-03-01'
      - name: end_date
        in: query
        description: 'Specify the end date of your time frame. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          example: '2010-03-02'
      - name: source
        in: query
        description: Specify a Source Currency other than the default USD. Supported on the Basic Plan and higher.
        required: false
        schema:
          type: string
          example: USD
      - name: currencies
        in: query
        description: Specify a comma-separated list of currency codes to limit your API response to specific currencies.
        required: false
        schema:
          type: string
          example: AUD,EUR,GBP,PLN
      - name: format
        in: query
        description: Set to `1` for pretty-printed JSON.
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
          example: 1
      - name: callback
        in: query
        description: Wrap the response in the function name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Exchange-rate quotes for each date in the requested timeframe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeframeResponse'
              examples:
                timeframeExample:
                  summary: Example timeframe response
                  value:
                    success: true
                    terms: https://currencylayer.com/terms
                    privacy: https://currencylayer.com/privacy
                    timeseries: true
                    start_date: '2012-05-01'
                    end_date: '2012-05-03'
                    source: USD
                    quotes:
                      '2012-05-01':
                        USDAUD: 0.9645
                        USDCHF: 0.91957
                      '2012-05-02':
                        USDAUD: 0.9575
                        USDCHF: 0.92036
                      '2012-05-03':
                        USDAUD: 0.95404
                        USDCHF: 0.91525
        '400':
          description: Bad Request - validation error (e.g. invalid_source_currency, invalid_currency_codes, no_timeframe_supplied, invalid_start_date, invalid_end_date, invalid_time_frame, time_frame_too_long).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangerate.host
  /historical:
    get:
      tags:
      - Endpoints
      summary: ExchangeRate.host :- /historical
      description: 'Returns accurate historical exchange rate data for every past day all the way back to the year of 1999. Historical rates may be accessed by attaching the date parameter with a valid date (Format: YYYY-MM-DD).

        *

        * **Note:** *Please be aware that Exchange Rate data for certain currencies may not be available for each requested day (e.g. Bitcoin was only introduced in 2009).*'
      operationId: exchangeratehostHistorical
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: date
        in: query
        description: 'Specify a date for which to request historical rates. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          example: '2005-02-01'
      - name: source
        in: query
        description: Specify a Source Currency other than the default USD. Supported on the Basic Plan and higher.
        required: false
        schema:
          type: string
          example: GBP
      - name: currencies
        in: query
        description: Specify a comma-separated list of currency codes to limit your API response to specific currencies.
        required: false
        schema:
          type: string
          example: AUD,CHF,EUR,GBP,PLN
      - name: format
        in: query
        description: Set to `1` for pretty-printed JSON.
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
          example: 1
      - name: callback
        in: query
        description: Wrap the response in the function name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Historical exchange rate data for the requested date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalResponse'
              examples:
                historicalExample:
                  summary: Example historical rates response
                  value:
                    success: true
                    terms: https://currencylayer.com/terms
                    privacy: https://currencylayer.com/privacy
                    historical: true
                    date: '2005-02-01'
                    timestamp: 1430401802
                    source: USD
                    quotes:
                      USDEUR: 0.918019
                      USDGBP: 0.650364
                      USDJPY: 119.640479
        '400':
          description: Bad Request - validation error (e.g. invalid_source_currency, invalid_currency_codes, no_date_supplied, invalid_date).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangerate.host
  /convert:
    get:
      tags:
      - Endpoints
      summary: ExchangeRate.host :- /convert
      description: Performs a single currency conversion. Specify a from currency code, a to currency code, and the amount you would like to convert.
      operationId: exchangeratehostConvert
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: Specify the currency to convert from.
        required: true
        schema:
          type: string
          example: USD
      - name: to
        in: query
        description: Specify the currency to convert to.
        required: true
        schema:
          type: string
          example: GBP
      - name: amount
        in: query
        description: Specify the amount to convert.
        required: true
        schema:
          type: number
          example: 10
      - name: date
        in: query
        description: 'Specify a date to use historical rates for this conversion. [Format: YYYY-MM-DD]'
        required: false
        schema:
          type: string
          format: date
      - name: format
        in: query
        description: Set to `1` for pretty-printed JSON.
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
          example: 1
      - name: callback
        in: query
        description: Wrap the response in the function name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Currency conversion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
              examples:
                convertExample:
                  summary: Example conversion response
                  value:
                    success: true
                    terms: https://currencylayer.com/terms
                    privacy: https://currencylayer.com/privacy
                    query:
                      from: USD
                      to: EUR
                      amount: 10
                    info:
                      timestamp: 1519328414
                      quote: 0.813399
                    result: 8.13399
        '400':
          description: Bad Request - validation error (e.g. invalid_from_currency, invalid_to_currency, invalid_conversion_amount, invalid_date).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangerate.host
  /live:
    get:
      tags:
      - Endpoints
      summary: ExchangeRate.host :- /live
      description: 'Returns real-time exchange rates. Optionally define an additional source currency and specific output currencies using the currencies parameter.

        *

        * **Note:** *Exchange rate data is refreshed every 60 minutes for Free & Basic customers, every 10 minutes for the Professional Plan, and every 60 seconds for Business customers.*'
      operationId: exchangeratehostLive
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: source
        in: query
        description: Specify a Source Currency other than the default USD. Supported on the Basic Plan and higher.
        required: false
        schema:
          type: string
          example: USD
      - name: currencies
        in: query
        description: Specify a comma-separated list of currency codes to limit your API response to specific currencies.
        required: false
        schema:
          type: string
          example: AUD,EUR,GBP,PLN
      - name: format
        in: query
        description: Set to `1` for pretty-printed JSON.
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
          example: 1
      - name: callback
        in: query
        description: Wrap the response in the function name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Real-time exchange rates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
              examples:
                liveExample:
                  summary: Example live rates response
                  value:
                    success: true
                    terms: https://currencylayer.com/terms
                    privacy: https://currencylayer.com/privacy
                    timestamp: 1430401802
                    source: USD
                    quotes:
                      USDEUR: 0.918019
                      USDGBP: 0.650364
                      USDJPY: 119.640479
        '400':
          description: Bad Request - validation error (e.g. invalid_source_currency, invalid_currency_codes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangerate.host
  /fluctuation:
    get:
      tags:
      - Endpoints
      summary: exchangeratesapi :- /fluctuation
      description: Returns fluctuation data (start rate, end rate, change and change percentage) between two dates for the requested currencies.
      operationId: exchangeratesapiFluctuation
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: 'The start date of your preferred timeframe. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 'The end date of your preferred timeframe. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          format: date
      - name: base
        in: query
        description: 'Change the base currency of your fluctuation data. [Default: EUR]'
        required: false
        schema:
          type: string
          example: EUR
      - name: symbols
        in: query
        description: Comma-separated list of currency codes to limit the output currencies.
        required: false
        schema:
          type: string
          example: USD,GBP,JPY
      - name: callback
        in: query
        description: JSONP callback function name. If provided, the response will be wrapped in this function.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Fluctuation metrics (start/end rate, change, change %) per currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FluctuationResponse'
              examples:
                default:
                  value:
                    success: true
                    fluctuation: true
                    start_date: '2015-12-01'
                    end_date: '2015-12-24'
                    base: EUR
                    rates:
                      USD:
                        start_rate: 1.066494
                        end_rate: 1.073844
                        change: 0.00735
                        change_pct: 0.6899
        '400':
          description: Bad Request - validation error (e.g. invalid base currency, invalid date, invalid amount, invalid timeframe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangeratesapi.io/v1
  /timeseries:
    get:
      tags:
      - Endpoints
      summary: exchangeratesapi :- /timeseries
      description: Returns daily historical exchange rates between two dates (max. 365 days) for the requested currencies.
      operationId: exchangeratesapiTimeseries
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: 'The start date of your preferred timeframe. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 'The end date of your preferred timeframe. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          format: date
      - name: base
        in: query
        description: 'Change the base currency of your time-series data. [Default: EUR]'
        required: false
        schema:
          type: string
          example: EUR
      - name: symbols
        in: query
        description: Comma-separated list of currency codes to limit the output currencies.
        required: false
        schema:
          type: string
          example: USD,GBP,JPY
      - name: callback
        in: query
        description: JSONP callback function name. If provided, the response will be wrapped in this function.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Daily time-series rates keyed by ISO date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeriesResponse'
              examples:
                default:
                  value:
                    success: true
                    timeseries: true
                    start_date: '2012-05-01'
                    end_date: '2012-05-03'
                    base: EUR
                    rates:
                      '2012-05-01':
                        USD: 1.322891
                        AUD: 1.278047
                        CAD: 1.302303
                      '2012-05-02':
                        USD: 1.315066
                        AUD: 1.274202
                        CAD: 1.299083
        '400':
          description: Bad Request - validation error (e.g. invalid base currency, invalid date, invalid amount, invalid timeframe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangeratesapi.io/v1
  /symbols:
    get:
      tags:
      - Endpoints
      summary: exchangeratesapi :- /symbols
      description: Returns all currently supported currency symbols together with their full names.
      operationId: exchangeratesapiSymbols
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: callback
        in: query
        description: JSONP callback function name. If provided, the response will be wrapped in this function.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Supported currency symbols (code -> name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolsResponse'
              examples:
                default:
                  value:
                    success: true
                    symbols:
                      USD: United States Dollar
                      EUR: Euro
                      GBP: British Pound Sterling
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangeratesapi.io/v1
  /latest:
    get:
      tags:
      - Endpoints
      summary: exchangeratesapi :- /latest
      description: Returns real-time exchange rate data for all available or a specific set of currencies.
      operationId: exchangeratesapiLatest
      parameters:
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: base
        in: query
        description: 'Change the base currency of your exchange rate data. [Default: EUR]'
        required: false
        schema:
          type: string
          example: EUR
      - name: symbols
        in: query
        description: Comma-separated list of currency codes to limit the output currencies.
        required: false
        schema:
          type: string
          example: USD,GBP,JPY
      - name: callback
        in: query
        description: JSONP callback function name. If provided, the response will be wrapped in this function.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Latest exchange rates snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestRatesResponse'
              examples:
                default:
                  value:
                    success: true
                    timestamp: 1519296206
                    base: EUR
                    date: '2025-09-15'
                    rates:
                      USD: 1.23396
                      GBP: 0.882047
                      JPY: 132.360679
        '400':
          description: Bad Request - validation error (e.g. invalid base currency, invalid date, invalid amount, invalid timeframe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    servers:
    - url: https://api.exchangeratesapi.io/v1
  /{date}:
    get:
      tags:
      - Endpoints
      summary: exchangeratesapi :- /{date}
      description: 'Returns historical exchange rate data for a specific day. [Format: YYYY-MM-DD]'
      operationId: exchangeratesapiHistorical
      parameters:
      - name: date
        in: path
        description: 'The date you would like to request historical rates for. [Format: YYYY-MM-DD]'
        required: true
        schema:
          type: string
          format: date
      - name: access_key
        in: query
        description: A unique key assigned to each API account used to authenticate with the API.
        required: true
        schema:
          type: string
      - name: base
        in: query
        description: 'Change the base currency of your exchange rate data. [Default: EUR]'
        required: false
        schema:
          type: string
          example: EUR
      - name: symbols
        in: query
        description: Comma-separated list of currency codes to limit the output currencies.
        required: false
        schema:
          type: string
          example: USD,GBP,JPY
      - name: callback
        in: query
        description: JSONP callback function name. If provided, the response will be wrapped in this function.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Historical rates for the requested date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalRatesResponse'
              examples:
                default:
                  value:
                    success: true
                    historical: true
                    date: '2013-12-24'
                    timestamp: 1387929599
                    base: GBP
                    rates:
