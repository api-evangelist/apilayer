summary: >-
  APILayer ships Node.js only, and says so: "Right now, we only have the Node.js SDK. If you are
  a developer and love to write code, join us to build SDKs in different languages and
  environments." Five per-product client packages plus one React chart component, all published
  by the npm user `api-layer` and all linked from apilayer.com/developers/suite/, which is what
  makes them first-party. Nothing exists on PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems,
  Packagist or crates.io - the packages named `apilayer` on npm and `ApiLayer` on PyPI are
  third-party and unrelated.
