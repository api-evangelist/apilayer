        historical: true
        date: '2013-12-24'
        timestamp: 1387929599
        base: GBP
        rates:
          USD: 1.636492
          EUR: 1.196476
          CAD: 1.739516
    ConvertInfo:
      properties:
        timestamp:
          type: integer
          example: 1519328414
        rate:
          type: number
          example: 148.972231
      type: object
    FluctuationResponse:
      description: Fluctuation analysis between two dates.
      properties:
        success:
          type: boolean
          example: true
        fluctuation:
          type: boolean
          example: true
        start_date:
          type: string
          format: date
          example: '2015-12-01'
        end_date:
          type: string
          format: date
          example: '2015-12-24'
        base:
          type: string
          example: EUR
        rates:
          description: Map of currency -> fluctuation metrics.
          type: object
          additionalProperties:
            properties:
              start_rate:
                type: number
              end_rate:
                type: number
              change:
                type: number
              change_pct:
                type: number
            type: object
      type: object
      example:
        success: true
        fluctuation: true
        start_date: '2015-12-01'
        end_date: '2015-12-24'
        base: EUR
        rates:
          USD:
            start_rate: 1.066494
