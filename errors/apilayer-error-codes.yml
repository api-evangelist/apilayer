generated: '2026-09-12'
method: derived
source: openapi/_original/*.json (components.responses examples published by APILayer), cross-checked
  against live responses observed 2026-09-12 on api.ipapi.com and api.exchangerate.host
provider: APILayer
providerId: apilayer
format: proprietary
rfc9457: false
envelope:
  shape: '{"success": false, "error": {"code": <int>, "type": "<slug>", "info": "<human sentence>"}}'
  success_flag: success
  container: error
  fields:
  - code
  - type
  - info
  note: Not application/problem+json. There is no type URI, no title/detail/instance, and no machine-stable
    link to documentation. The `type` slug is the only reliable discriminator; `code` is REUSED across
    different meanings (104 is both api_access_blocked on 403 and usage_limit_reached on 429; 105 covers
    two distinct 403 conditions), so an agent must branch on `type`, never on `code` alone.
status_code_fidelity:
  documented: true
  observed: false
  note: The OpenAPI maps each error class onto a real HTTP status (401/403/404/429/500/503), but the deployed
    API returned HTTP 200 carrying the error envelope for an invalid access key on both hosts probed 2026-09-12.
    An agent that branches on HTTP status alone will read an auth failure as a success. Branch on the
    `success` boolean.
problem_types:
