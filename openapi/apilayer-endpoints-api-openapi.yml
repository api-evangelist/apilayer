  /{IPAddress}:
    get:
      tags:
      - Endpoints
      summary: ipapi :- Standard & Bulk IP Lookup
      description: The ipapi primary endpoint looks up IPv4/IPv6 addresses. Attach a single IP address to the base URL for a Standard Lookup, or a comma-separated list of up to 50 addresses for a Bulk Lookup. Domain URLs are also accepted and resolved to the underlying IP address.
      operationId: ipapiIPLookup
      parameters:
      - name: IPAddress
        in: path
        description: A single IPv4/IPv6 address (Standard Lookup) or a comma-separated list of up to 50 addresses (Bulk Lookup). Domain URLs are also accepted.
        required: true
        schema:
          type: string
          example: 134.201.250.155
      - name: access_key
        in: query
        description: Your API Access Key.
        required: true
        schema:
          type: string
      - name: callback
        in: query
        description: Specify a JSONP callback function name according to the JSONP Callbacks section.
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: Set to your preferred output field(s) according to the Specify Output Fields section.
        required: false
        schema:
          type: string
      - name: hostname
        in: query
        description: Set to 1 to enable Hostname Lookup.
        required: false
        schema:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          example: 1
      - name: security
        in: query
