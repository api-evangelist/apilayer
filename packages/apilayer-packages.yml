currency_finding: >-
  Every first-party package was last published between October and December 2024 - roughly two
  years stale as of this check - while the product contracts kept moving (Marketstack and
  Serpstack are both on 2.0.0). No package declares a repository or homepage in its registry
  metadata, so there is no public source tree to read, and none of the five carries a source
  link on GitHub even though APILayer maintains an active org there. Nothing covers the three
  APIs captured in this repo: there is no client for exchangerate.host, exchangeratesapi.io or
  ipapi.com.
