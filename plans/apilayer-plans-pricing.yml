findings:
  - The free tier is 100 requests a MONTH - roughly three a day - and is explicitly
    non-commercial with no support. It is an evaluation allowance, not a usable free plan.
  - HTTPS appears as a paid feature in the feature matrix and in APILayer's own error catalog
    (code 105, https_access_restricted), meaning free-tier traffic is expected to carry the API
    key over plaintext HTTP.
  - Every paid tier bills overage per request beyond the quota, at a published per-request
    price, so cost is metered rather than hard-capped. An agent that loops can spend real money.
  - Pricing is uniform across the FX products (14.99 / 59.99 / 99.99 for 10k / 100k / 500k) and
    differs on ipapi, which suggests a shared pricing template across the estate.
