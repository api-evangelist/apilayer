components:
  responses:
    '429':
      description: Too Many Requests
      content:
        application/json; Charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            usage_limit_reached:
              summary: usage_limit_reached
              value:
                success: false
                error:
                  code: 104
                  type: usage_limit_reached
                  info: Your monthly usage limit has been reached. Please upgrade your Subscription Plan.
            daily_usage_limit_reached:
              summary: daily_usage_limit_reached
              value:
                success: false
                error:
                  code: 104
                  type: daily_usage_limit_reached
                  info: Your daily usage limit has been reached. Please try again tomorrow or upgrade your subscription plan.
            fair_use_limit_reached:
              summary: fair_use_limit_reached
              value:
                success: false
                error:
                  code: 104
                  type: fair_use_limit_reached
                  info: 'Your fair use limit has been reached. [Please contact support: support@apilayer.com]'
            rate_limit_reached:
              summary: rate_limit_reached
              value:
                success: false
                error:
                  code: 106
                  type: rate_limit_reached
                  info: 'You have exceeded the maximum rate limitation allowed on your subscription plan. Please refer to the "Rate Limits" section of the API Documentation for details. '
    '503':
      description: Service Unavailable
      content:
        application/json; Charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            maintenance_mode:
              summary: maintenance_mode
              value:
                success: false
                error:
                  code: 503
                  type: maintenance_mode
                  info: ''
    '404':
      description: Not Found
      content:
        application/json; Charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_api_function:
              summary: invalid_api_function
              value:
                success: false
                error:
                  code: 103
                  type: invalid_api_function
                  info: This API Function does not exist.
            404_not_found:
              summary: 404_not_found
              value:
                success: false
                error:
                  code: 404
                  type: 404_not_found
                  info: 404 - The requested resource could not be found. Please try again or contact support.
    '401':
      description: Unauthorized
      content:
        application/json; Charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            account_on_hold:
              summary: account_on_hold
              value:
                success: false
                error:
                  code: 107
                  type: account_on_hold
                  info: 'Your account currently has open invoices and API has been automatically disabled. Please settle your open balance or downgrade to the Free Plan to restore API access. [Support: support@apilayer.com]'
            invalid_access_key:
              summary: invalid_access_key
              value:
                success: false
                error:
                  code: 101
                  type: invalid_access_key
                  info: 'You have not supplied a valid API Access Key. [Technical Support: support@apilayer.com]'
            missing_access_key:
              summary: missing_access_key
              value:
                success: false
                error:
                  code: 101
                  type: missing_access_key
                  info: 'You have not supplied an API Access Key. [Required format: access_key=YOUR_ACCESS_KEY]'
            inactive_user:
              summary: inactive_user
              value:
                success: false
                error:
                  code: 102
                  type: inactive_user
                  info: Permission denied - User not active.
    '403':
      description: Forbidden
      content:
        application/json; Charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            https_access_restricted:
              summary: https_access_restricted
              value:
                success: false
                error:
                  code: 105
                  type: https_access_restricted
                  info: Access Restricted - Your current Subscription Plan does not support HTTPS Encryption.
            function_access_restricted:
              summary: function_access_restricted
              value:
                success: false
                error:
                  code: 105
                  type: function_access_restricted
                  info: Access Restricted - Your current Subscription Plan does not support this API Function.
            api_access_blocked:
              summary: api_access_blocked
              value:
                success: false
                error:
                  code: 104
                  type: api_access_blocked
                  info: Your API access has been temporarily disabled. Please upgrade your Subscription Plan or contact support.
    '500':
      description: Internal Server Error
      content:
        application/json; Charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internal_error:
              summary: internal_error
              value:
                success: false
                error:
                  code: 0
                  type: internal_error
                  info: 'An error has occured. [Technical Support: support@apilayer.com]'
  schemas:
    HistoricalResponse:
      description: Historical exchange rate data for a date.
      properties:
        success:
          type: boolean
          example: true
        terms:
          type: string
        privacy:
          type: string
        historical:
          type: boolean
          example: true
        date:
          type: string
          format: date
          example: '2005-02-01'
        timestamp:
          type: integer
          example: 1430401802
        source:
          type: string
          example: USD
        quotes:
          type: object
          additionalProperties:
            type: number
      type: object
      example:
        success: true
        terms: https://currencylayer.com/terms
        privacy: https://currencylayer.com/privacy
        historical: true
        date: '2005-02-01'
        timestamp: 1430401802
        source: USD
        quotes:
          USDEUR: 0.918019
          USDGBP: 0.650364
          USDJPY: 119.640479
    TimeframeResponse:
      description: Exchange-rate quotes for each date in a timeframe.
      properties:
        success:
          type: boolean
          example: true
        terms:
          type: string
        privacy:
          type: string
        timeframe:
          type: boolean
          example: true
        start_date:
          type: string
          format: date
          example: '2012-05-01'
        end_date:
          type: string
          format: date
          example: '2012-05-03'
        source:
          type: string
          example: USD
        quotes:
          description: Map of ISO date -> (map of currency pair -> rate).
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number
      type: object
      example:
        success: true
        terms: https://currencylayer.com/terms
        privacy: https://currencylayer.com/privacy
        timeseries: true
        start_date: '2012-05-01'
        end_date: '2012-05-03'
        source: USD
        quotes:
          '2012-05-01':
            USDAUD: 0.9645
            USDCHF: 0.91957
          '2012-05-02':
            USDAUD: 0.9575
            USDCHF: 0.92036
          '2012-05-03':
            USDAUD: 0.95404
            USDCHF: 0.91525
    ConvertResponse:
      description: Currency conversion result.
      properties:
        success:
          type: boolean
          example: true
        terms:
          type: string
        privacy:
          type: string
        query:
          properties:
            from:
              type: string
              example: USD
            to:
              type: string
              example: EUR
            amount:
              type: number
              example: 10
          type: object
        info:
          properties:
            timestamp:
              type: integer
              example: 1519328414
            quote:
              type: number
              example: 0.813399
          type: object
        result:
          type: number
          example: 8.13399
      type: object
    LiveResponse:
      description: Real-time exchange rates.
      properties:
        success:
          type: boolean
          example: true
        terms:
          type: string
          example: https://currencylayer.com/terms
        privacy:
          type: string
          example: https://currencylayer.com/privacy
        timestamp:
          type: integer
          example: 1430401802
        source:
          type: string
          example: USD
        quotes:
          description: Currency-pair quotes keyed by pair symbol (e.g. USDEUR).
          type: object
          additionalProperties:
            type: number
      type: object
      example:
        success: true
        terms: https://currencylayer.com/terms
        privacy: https://currencylayer.com/privacy
        timestamp: 1430401802
        source: USD
        quotes:
          USDEUR: 0.918019
          USDGBP: 0.650364
          USDJPY: 119.640479
    Error:
      title: Error
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: integer
              example: 101
            type:
              type: string
              example: invalid_access_key
            info:
              type: string
              example: 'You have not supplied a valid API Access Key. [Technical Support: support@apilayer.com]'
    ChangeResponse:
      description: Currency fluctuation between two dates.
      properties:
        success:
          type: boolean
          example: true
        terms:
          type: string
        privacy:
          type: string
        change:
          type: boolean
          example: true
        start_date:
          type: string
          format: date
          example: '2015-01-01'
        end_date:
          type: string
          format: date
          example: '2015-01-02'
        source:
          type: string
          example: USD
        quotes:
          description: Map of currency pair -> change statistics.
          type: object
          additionalProperties:
            properties:
              start_rate:
                type: number
              end_rate:
                type: number
              change:
                type: number
              change_pct:
                type: number
            type: object
      type: object
      example:
        success: true
        terms: https://currencylayer.com/terms
        privacy: https://currencylayer.com/privacy
        change: true
        start_date: '2015-01-01'
        end_date: '2015-01-02'
        source: USD
        quotes:
          USDAUD:
            start_rate: 1.2345
            end_rate: 1.3456
            change: 0.1111
            change_pct: 0.09
    LatestRatesResponse:
      description: Latest exchange rates snapshot.
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: integer
          example: 1519296206
        base:
          type: string
          example: EUR
        date:
          type: string
          format: date
          example: '2025-09-15'
        rates:
          description: Map of currency code -> rate relative to base.
          type: object
          additionalProperties:
            type: number
      type: object
      example:
        success: true
        timestamp: 1519296206
        base: EUR
        date: '2025-09-15'
        rates:
          USD: 1.23396
          GBP: 0.882047
          JPY: 132.360679
    HistoricalRatesResponse:
      description: Historical rates for a date.
      properties:
        success:
          type: boolean
          example: true
        historical:
          type: boolean
          example: true
        date:
          type: string
          format: date
          example: '2013-12-24'
        timestamp:
          type: integer
          example: 1387929599
        base:
          type: string
          example: GBP
        rates:
          type: object
          additionalProperties:
            type: number
      type: object
      example:
