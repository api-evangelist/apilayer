created: '2026-05-04'
modified: '2026-09-12'
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented three tiers ("Free 1,000 req/mo at 10 rpm",
  "Professional 100,000 req/mo, price TBD", "Enterprise") against https://api.apilayer.com. None
  of those numbers came from APILayer and the marketplace host they were attached to publishes
  no plans at all. Replaced here with the tiers APILayer actually publishes.
platform_pricing:
  marketplace_wide_page: false
  note: >-
    There is NO marketplace-level pricing page. https://apilayer.com/pricing returns HTTP 404
    (checked 2026-09-12) and no pricing link appears in the apilayer.com navigation or footer.
    Every plan is published on the product's own domain, priced per product and billed per
    product, so a customer of four APILayer APIs holds four subscriptions and four keys. The
    only platform-wide commitments APILayer states are: a free plan on every API, no credit card
    required to start, and monthly or yearly billing with a 10-15 percent annual discount.
  free_tier_universal: true
  billing_periods: [monthly, yearly]
  currency: USD
