  by APILayer''s own docs host, and every servers[] entry is an APILayer product domain. Nineteen of the
  products, however, have their OWN repo in all/*, and APILayer is their declared parent (ipstack carries
  x-parent-company: apilayer). Carrying their contracts here too would duplicate them across the estate,
  so this record carries only the three products that have no repo of their own - exchangerate, exchangeratesapi
  and ipapi - and indexes the rest as leads.'
