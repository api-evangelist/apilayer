domain_standard:
  applicable: false
  note: >-
    Checked for a declarable domain standard in the contracts and found none, which is the
    correct result for this market rather than a gap. The FX products emit ISO 4217 currency
    codes and ISO 8601 dates and the IP product emits ISO 3166-1 country codes, but these are
    field-level value vocabularies, not a message or interface standard a counterparty could
    implement against. There is no ISO 20022, FIX, FDX or comparable wire standard in any
    APILayer contract.
    Identifier vocabularies observed, for the record: ISO 4217 (currency), ISO 8601 (date),
    ISO 3166-1 alpha-2 (country), IANA tz database (timezone).
